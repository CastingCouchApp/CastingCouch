[package]
name = "ccs-overlay-server"
version = "8.0.0-beta.1"
edition = "2021"
description = "Loopback overlay HTTP + WebSocket server (OBS-compatible routes)"

[dependencies]
ccs-core = { path = "../ccs-core" }
axum = { version = "0.8", features = ["ws", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "fs", "time"] }
tower-http = { version = "0.6", features = ["fs", "cors", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
mime_guess = "2"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

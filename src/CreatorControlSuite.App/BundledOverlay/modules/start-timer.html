<!doctype html><html><head><meta charset="utf-8"><title>STARTTIMER</title><link rel="stylesheet" href="../assets/base.css"><script src="../assets/data-client.js"></script><script src="../assets/config-client.js"></script></head><body style="display:flex;align-items:center;justify-content:center"><div><div id="v" class="card user-text" style="padding:20px 32px;font-size:96px;font-weight:900"></div></div><script>let base=600,started=Date.now();CreatorOverlayConfig.subscribe(c=>{base=c.startTimerSeconds||600;document.body.style.alignItems='flex-start';document.body.style.justifyContent='flex-start';v.parentElement.style.transform=`translate(${c.timerX||760}px,${c.timerY||700}px)`;});setInterval(()=>{let n=Math.max(0,base-Math.floor((Date.now()-started)/1000));v.textContent=String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');},250);</script></body></html>

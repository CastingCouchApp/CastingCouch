<!doctype html><html><head><meta charset="utf-8"><title>STARTTIMER</title><link rel="stylesheet" href="../assets/base.css"><script src="../assets/data-client.js"></script><script src="../assets/config-client.js"></script></head><body style="display:flex;align-items:center;justify-content:center"><div><div id="v" class="card user-text" style="padding:20px 32px;font-size:96px;font-weight:900">10:00</div></div><script>const base=600;let streamStartedAt=null,isLive=false;CreatorOverlayConfig.subscribe(c=>{document.body.style.alignItems='flex-start';document.body.style.justifyContent='flex-start';v.parentElement.style.transform=`translate(${c.timerX||760}px,${c.timerY||700}px)`;});CreatorOverlayData.subscribe(d=>{const s=d.stream||{};isLive=s.isLive===true;const parsed=Date.parse(s.startedAt||'');streamStartedAt=isLive&&Number.isFinite(parsed)?parsed:null;});setInterval(()=>{const elapsed=streamStartedAt===null?0:Math.max(0,Math.floor((Date.now()-streamStartedAt)/1000));const n=Math.max(0,base-elapsed);v.textContent=String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');},250);</script></body></html>

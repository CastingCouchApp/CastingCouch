<!doctype html><html><head><meta charset="utf-8"><title>LIVE INFO</title><link rel="stylesheet" href="../assets/base.css"><script src="../assets/data-client.js"></script><script src="../assets/config-client.js"></script></head><body style="display:flex;align-items:center;justify-content:center"><div><div class="card" style="padding:16px 24px;font-size:28px"><span style="color:#ff3b30;font-weight:900">● LIVE</span> <span id="elapsed"></span> · <span id="clock"></span></div></div><script>let data={};CreatorOverlayData.subscribe(d=>data=d);setInterval(()=>{let s=data.stream?.elapsedSeconds||0;elapsed.textContent=String(Math.floor(s/3600)).padStart(2,'0')+':'+String(Math.floor(s/60)%60).padStart(2,'0')+':'+String(s%60).padStart(2,'0');clock.textContent=new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});},500);</script></body></html>

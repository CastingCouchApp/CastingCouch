<!doctype html><html><head><meta charset="utf-8"><title>SPOTIFY INFO</title><link rel="stylesheet" href="../assets/base.css"><script src="../assets/data-client.js"></script><script src="../assets/config-client.js"></script></head><body style="display:flex;align-items:center;justify-content:center"><div><div id="box" class="card" style="width:620px;padding:18px"><div style="display:flex;gap:18px"><img id="cover" style="width:110px;height:110px;object-fit:cover;border-radius:10px"><div style="flex:1"><div id="title" style="font-size:30px;font-weight:800"></div><div id="artist" class="muted" style="font-size:22px"></div><div id="album" class="muted" style="font-size:18px"></div><div style="height:8px;background:#333;border-radius:5px;margin-top:14px"><div id="prog" style="height:100%;background:var(--accent);border-radius:5px;width:0"></div></div></div></div></div></div><script>CreatorOverlayData.subscribe(d=>{const s=d.spotify||{};box.style.display=(s.showInOverlay===false||(!s.isPlaying&&s.hideWhenPaused))?'none':'block';title.style.display=s.showTitle===false?'none':'';artist.style.display=s.showArtist===false?'none':'';album.style.display=s.showArtist===false?'none':'';cover.style.display=s.showAlbumCover===false?'none':'';prog.parentElement.style.display=s.showProgress===false?'none':'';title.textContent=s.title||'Kein Titel';artist.textContent=s.artist||'';album.textContent=s.album||'';cover.src=s.coverUrl||'';prog.style.width=((s.durationMs?100*s.progressMs/s.durationMs:0))+'%';});</script></body></html>

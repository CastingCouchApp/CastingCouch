<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CCS Overlay Editor</title>
  <link rel="stylesheet" href="/canvas/shared/styles.css" />
  <link rel="stylesheet" href="/canvas/editor/editor.css" />
</head>
<body class="ccs-editor-body">
  <div class="ccs-editor-shell">
    <aside class="ccs-palette">
      <h1>Overlay Editor</h1>
      <p class="ccs-muted" id="instanceLabel">Instanz</p>
      <h2>Widgets</h2>
      <div class="ccs-palette-list" id="widgetPalette"></div>
      <h2>Shapes / Frames</h2>
      <div class="ccs-palette-list" id="shapePalette"></div>
      <div class="ccs-editor-status" id="saveStatus">Bereit</div>
      <details class="ccs-palette-section" id="canvasSizeSection">
        <summary class="ccs-palette-section-summary">Fenstergröße</summary>
        <div class="ccs-palette-section-body">
          <label class="ccs-size-label">Preset
            <select id="canvasSizePreset"></select>
          </label>
          <div class="ccs-size-row">
            <label>B <input id="canvasWidthInput" type="number" min="320" max="7680" step="1" /></label>
            <label>H <input id="canvasHeightInput" type="number" min="180" max="4320" step="1" /></label>
          </div>
          <button type="button" id="btnApplyCanvasSize" class="ccs-palette-item">Größe anwenden</button>
          <p class="ccs-muted" id="obsSizeLabel">OBS: –</p>
          <button type="button" id="btnApplyObsSize" class="ccs-palette-item">Von OBS übernehmen</button>
          <p class="ccs-muted" id="canvasSizeHint">Canvas ist fest; OBS-Browserquelle gleich setzen.</p>
        </div>
      </details>
    </aside>
    <main class="ccs-stage-wrap">
      <div class="ccs-stage-toolbar">
        <button type="button" id="btnDelete" class="ccs-toolbar-btn" title="Löschen" aria-label="Löschen" disabled>
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 4.5h9M6 4.5V3.5h4v1M5 4.5l.5 9h5l.5-9" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button type="button" id="btnDuplicate" class="ccs-toolbar-btn" title="Duplizieren" aria-label="Duplizieren">
          <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="5.5" y="5.5" width="7" height="7" rx="1" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M3.5 10.5V3.5h7" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        </button>
        <button type="button" id="btnFront" class="ccs-toolbar-btn" title="Ganz nach oben" aria-label="Ganz nach oben">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 12.5V4.5M5.5 7 8 4.5 10.5 7M3.5 13.5h9" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button type="button" id="btnLayerUp" class="ccs-toolbar-btn" title="Ebene rauf" aria-label="Ebene rauf">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 11.5V4.5M5.5 7 8 4.5 10.5 7" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button type="button" id="btnLayerDown" class="ccs-toolbar-btn" title="Ebene runter" aria-label="Ebene runter">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 4.5v7M5.5 9 8 11.5 10.5 9" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button type="button" id="btnBack" class="ccs-toolbar-btn" title="Ganz nach unten" aria-label="Ganz nach unten">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3.5v8M5.5 9 8 11.5 10.5 9M3.5 2.5h9" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <span class="ccs-toolbar-sep" aria-hidden="true"></span>
        <label class="ccs-toolbar-btn ccs-toolbar-toggle" title="OBS-Vorschau">
          <input type="checkbox" id="toggleObsPreview" />
          <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2.5" y="3.5" width="11" height="8" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M5.5 13.5h5M8 11.5v2" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
          <span class="ccs-sr-only">OBS-Vorschau</span>
        </label>
        <label class="ccs-toolbar-btn ccs-toolbar-toggle" title="Raster">
          <input type="checkbox" id="toggleGrid" />
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 3.5h9v9h-9zM8 3.5v9M3.5 8h9" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
          <span class="ccs-sr-only">Raster</span>
        </label>
        <label class="ccs-toolbar-toggle ccs-toolbar-num" title="Raster horizontal">H <input type="number" id="gridHInput" min="2" max="64" step="1" value="32" aria-label="Raster horizontal" /></label>
        <label class="ccs-toolbar-toggle ccs-toolbar-num" title="Raster vertikal">V <input type="number" id="gridVInput" min="2" max="64" step="1" value="16" aria-label="Raster vertikal" /></label>
        <label class="ccs-toolbar-btn ccs-toolbar-toggle" title="Einrasten an Raster">
          <input type="checkbox" id="toggleGridSnap" />
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8h3M9.5 8h3M8 3.5v3M8 9.5v3M6.2 6.2l1.8 1.8 1.8-1.8M6.2 9.8l1.8-1.8 1.8 1.8" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="ccs-sr-only">Einrasten</span>
        </label>
        <label class="ccs-toolbar-btn ccs-toolbar-toggle" title="Magnet">
          <input type="checkbox" id="toggleMagnet" />
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 2.5v5a3.5 3.5 0 0 0 7 0v-5M4.5 2.5h2v5M9.5 2.5h2v5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="ccs-sr-only">Magnet</span>
        </label>
        <span class="ccs-muted" id="canvasSizeBadge">1920 × 1080</span>
        <span class="ccs-muted" id="hint">Rechtsklick · Ziehen · Auto-Save</span>
      </div>
      <div class="ccs-canvas-root" id="stage"></div>
    </main>
    <aside class="ccs-props">
      <h2>Eigenschaften</h2>
      <div id="propsEmpty" class="ccs-muted">Kein Element ausgewählt</div>
      <div id="propsForm" class="ccs-props-form" hidden>
        <nav class="ccs-props-tabs" id="propsTabs" role="tablist">
          <button type="button" class="ccs-props-tab" data-tab="layout" role="tab" aria-selected="true">Layout</button>
          <button type="button" class="ccs-props-tab" data-tab="widget" role="tab" aria-selected="false">Widget</button>
          <button type="button" class="ccs-props-tab" data-tab="effects" role="tab" aria-selected="false">Effekte</button>
          <button type="button" class="ccs-props-tab" data-tab="animations" role="tab" aria-selected="false">Animationen</button>
        </nav>
        <div class="ccs-props-pane" id="propsPaneLayout" data-pane="layout" role="tabpanel">
          <label>Typ <input id="propType" readonly /></label>
          <label>X <input id="propX" type="number" /></label>
          <label>Y <input id="propY" type="number" /></label>
          <label>Breite <input id="propW" type="number" /></label>
          <label>Höhe <input id="propH" type="number" /></label>
          <label>Z <input id="propZ" type="number" /></label>
          <label>Gesperrt <input id="propLocked" type="checkbox" class="ccs-check" /></label>
        </div>
        <div class="ccs-props-pane" id="propExtra" data-pane="widget" role="tabpanel" hidden></div>
        <div class="ccs-props-pane" id="propEffects" data-pane="effects" role="tabpanel" hidden></div>
        <div class="ccs-props-pane" id="propAnimations" data-pane="animations" role="tabpanel" hidden></div>
      </div>
    </aside>
  </div>
  <script src="/canvas/shared/runtime.js"></script>
  <script src="/canvas/editor/editor.js"></script>
</body>
</html>

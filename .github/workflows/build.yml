name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CONFIGURATION: Release

jobs:
  build:
    name: Build & Test
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/CreatorControlSuite.Modules.Overlay/CanvasOverlay/package-lock.json

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json', '**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore CreatorControlSuite.sln

      - name: Build
        run: >
          dotnet build CreatorControlSuite.sln
          -c ${{ env.CONFIGURATION }}
          --no-restore
          -p:ContinuousIntegrationBuild=true

      - name: Test
        run: >
          dotnet test tests/CreatorControlSuite.Tests/CreatorControlSuite.Tests.csproj
          -c ${{ env.CONFIGURATION }}
          --no-build
          --logger "trx;LogFileName=tests.trx"
          --results-directory artifacts/test-results

      - name: Publish (win-x64)
        run: >
          dotnet publish src/CreatorControlSuite.App/CreatorControlSuite.App.csproj
          -c ${{ env.CONFIGURATION }}
          -r win-x64
          --self-contained true
          -p:PublishReadyToRun=false
          -p:DebugType=embedded
          -p:ContinuousIntegrationBuild=true
          -o artifacts/publish/win-x64

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/test-results/**
          if-no-files-found: ignore

      - name: Upload publish output
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: publish-win-x64
          path: artifacts/publish/win-x64/**
          if-no-files-found: error
          retention-days: 14

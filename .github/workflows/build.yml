name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CONFIGURATION: Release

jobs:
  overlay:
    name: Overlay Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/CreatorControlSuite.Modules.Overlay/CanvasOverlay/package-lock.json

      - name: Install
        working-directory: src/CreatorControlSuite.Modules.Overlay/CanvasOverlay
        run: npm ci

      - name: Typecheck
        working-directory: src/CreatorControlSuite.Modules.Overlay/CanvasOverlay
        run: npm run typecheck

      - name: Unit and DOM smoke tests
        working-directory: src/CreatorControlSuite.Modules.Overlay/CanvasOverlay
        run: npm test

      - name: Bundle
        working-directory: src/CreatorControlSuite.Modules.Overlay/CanvasOverlay
        run: npm run build

  architecture:
    name: Architecture Gates
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/CreatorControlSuite.Modules.Overlay/CanvasOverlay/package-lock.json

      - name: Restore
        run: dotnet restore tests/CreatorControlSuite.Tests/CreatorControlSuite.Tests.csproj

      - name: Architecture tests
        run: >
          dotnet test tests/CreatorControlSuite.Tests/CreatorControlSuite.Tests.csproj
          -c ${{ env.CONFIGURATION }}
          --no-restore
          --filter Category=Architecture

      - name: PowerShell syntax
        shell: pwsh
        run: ./build/Test-PowerShellSyntax.ps1

  security:
    name: Dependency Security
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/CreatorControlSuite.Modules.Overlay/CanvasOverlay/package-lock.json

      - name: Restore
        run: dotnet restore CreatorControlSuite.sln

      - name: NuGet vulnerability audit
        run: dotnet list CreatorControlSuite.sln package --vulnerable --include-transitive --no-restore

      - name: npm vulnerability audit
        working-directory: src/CreatorControlSuite.Modules.Overlay/CanvasOverlay
        run: npm audit --audit-level=high

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Review dependency changes
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  dotnet:
    name: Build & Test
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/CreatorControlSuite.Modules.Overlay/CanvasOverlay/package-lock.json

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json', '**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore CreatorControlSuite.sln

      - name: Build
        run: >
          dotnet build CreatorControlSuite.sln
          -c ${{ env.CONFIGURATION }}
          --no-restore
          -p:ContinuousIntegrationBuild=true

      - name: Test
        run: >
          dotnet test tests/CreatorControlSuite.Tests/CreatorControlSuite.Tests.csproj
          -c ${{ env.CONFIGURATION }}
          --no-build
          --collect "XPlat Code Coverage"
          --logger "trx;LogFileName=tests.trx"
          --results-directory artifacts/test-results

      - name: Enforce coverage baseline
        shell: pwsh
        run: |
          $coverage = Get-ChildItem artifacts/test-results -Recurse -Filter coverage.cobertura.xml |
            Select-Object -First 1
          if ($null -eq $coverage) {
            throw "Coverage-Datei fehlt."
          }
          ./build/Test-CoverageBaseline.ps1 -CoveragePath $coverage.FullName

      - name: Test critical coverage gate
        run: node --test build/tests/Test-CriticalCoverage.test.mjs

      - name: Determine changed files
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          $base = $env:BASE_SHA
          if ([string]::IsNullOrWhiteSpace($base) -or $base -match '^0+$') {
            $base = git rev-parse HEAD^ 2>$null
          }
          if ([string]::IsNullOrWhiteSpace($base)) {
            git show --pretty="" --name-only HEAD |
              Set-Content artifacts/test-results/changed-files.txt
          }
          else {
            git diff --name-only $base $env:GITHUB_SHA |
              Set-Content artifacts/test-results/changed-files.txt
          }

      - name: Enforce critical coverage
        shell: pwsh
        run: |
          $coverage = Get-ChildItem artifacts/test-results -Recurse -Filter coverage.cobertura.xml |
            Select-Object -First 1
          if ($null -eq $coverage) {
            throw "Coverage-Datei fehlt."
          }
          node build/Test-CriticalCoverage.mjs `
            $coverage.FullName `
            build/coverage-critical.json `
            artifacts/test-results/changed-files.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/test-results/**
          if-no-files-found: ignore

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: artifacts/test-results/**/coverage.cobertura.xml
          if-no-files-found: error

  package:
    name: Package (win-x64)
    needs: [overlay, architecture, security, dotnet]
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/CreatorControlSuite.Modules.Overlay/CanvasOverlay/package-lock.json

      - name: Restore
        run: dotnet restore CreatorControlSuite.sln

      - name: Publish (win-x64)
        run: >
          dotnet publish src/CreatorControlSuite.App/CreatorControlSuite.App.csproj
          -c ${{ env.CONFIGURATION }}
          -r win-x64
          --self-contained true
          -p:PublishReadyToRun=false
          -p:DebugType=embedded
          -p:ContinuousIntegrationBuild=true
          -o artifacts/publish/win-x64

      - name: Upload publish output
        uses: actions/upload-artifact@v4
        with:
          name: publish-win-x64
          path: artifacts/publish/win-x64/**
          if-no-files-found: error
          retention-days: 14
